name: Build Zola website and deploy to GitHub Pages

env:
  ZOLA_VERSION: 0.22.1

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# concurrency:
#   cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: "DEBUG: echo this repository's Pages domain"
        run: echo "${{ steps.pages.outputs.base_url }}"

      - name: "DEBUG: echo zola's path and version"
        run: |
          echo "which zola"
          echo "zola --version"


      - name: Cache zola if it isn't
        id: check-cache
        uses: actions/cache@v6
        with:
          path: ~/.install-action/
          key: install-action-${{ runner.os }}-zola-${{ env.ZOLA_VERSION }}

      - name: Check the cache and get zola if not
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ env.ZOLA_VERSION }}

      - name: Add install-action to PATH
        if: steps.check-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"

      - name: Build the website
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload /public as an action artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@v4
